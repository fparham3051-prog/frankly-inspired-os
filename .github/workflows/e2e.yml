name: Browser tests
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fios_e2e }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: mkdir -p shots && node test/e2e.js
        env: { E2E_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/fios_e2e", E2E_SHOTS: "shots" }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: shots, if-no-files-found: ignore }
