<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Client workspace | Frankly Inspired and Associates</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<meta name="theme-color" content="#172337">
<link rel="stylesheet" href="/styles.css">
<style>
  body { background: #f6f4ef; color: #1d2733; }
  .cw h1, .cw h2, .cw h3, .stat b, .cw b, .cw strong { color: #172337; }
  .cw a { color: #2a5d9f; } .cw a.btn { color: #fff; }
  .cw { max-width: 920px; margin: 0 auto; padding: 18px 16px 60px; }
  .cw h1 { font-size: 1.6rem; margin: 6px 0 2px; }
  .cw .sub { color: #5b6573; margin: 0 0 14px; }
  .cw nav { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 16px; }
  .cw nav button { border: 1px solid #d8d3c8; background: #fff; border-radius: 999px; padding: 7px 14px; font: inherit; cursor: pointer; }
  .cw nav button[aria-selected="true"] { background: #172337; color: #fff; border-color: #172337; }
  .card { background: #fff; border: 1px solid #e4dfd4; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .muted { color: #6b7380; } .small { font-size: .88rem; }
  .bar { height: 8px; background: #ece7dc; border-radius: 6px; overflow: hidden; margin: 6px 0; }
  .bar > i { display: block; height: 100%; background: #2c7a57; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { border: 1px solid #ece7dc; border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 1.5rem; }
  .task { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f0ece3; }
  .task.done .t { text-decoration: line-through; color: #6b7380; }
  .pill { font-size: .78rem; border-radius: 999px; padding: 2px 8px; background: #ece7dc; white-space: nowrap; }
  .pill.ok { background: #dcefe3; color: #1f5c3f; } .pill.wait { background: #f8e3c9; color: #7a4a10; }
  .msg { padding: 9px 0; border-bottom: 1px solid #f0ece3; } .msg.reply { margin-left: 22px; }
  .msg .who { font-weight: 600; } .msg .text { white-space: pre-wrap; margin-top: 3px; }
  .flag { font-size: .75rem; background: #172337; color: #fff; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
  textarea { width: 100%; min-height: 80px; border: 1px solid #d8d3c8; border-radius: 8px; padding: 8px; font: inherit; box-sizing: border-box; }
  .btn { border: 0; background: #172337; color: #fff; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .btn.ghost { background: #fff; color: #172337; border: 1px solid #d8d3c8; }
  .linkbtn { background: none; border: 0; color: #2a5d9f; cursor: pointer; padding: 0; font: inherit; }
  table.cmp { width: 100%; border-collapse: collapse; } table.cmp td, table.cmp th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #f0ece3; }
  .up { color: #1f5c3f; font-weight: 600; } .down { color: #a33d3d; font-weight: 600; }
  .banner { background: #fff6dd; border: 1px solid #f0d98a; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  @media print {
    .brandbar-actions, nav, .noprint, .banner { display: none !important; }
    body { background: #fff; } .card { border: 0; padding: 0 0 10px; break-inside: avoid; }
    [data-tab]:not([data-tab="outcomes"]) { display: none !important; } [data-tab="outcomes"] { display: block !important; }
  }
</style>
</head>
<body>
<div class="brandbar">
  <div class="wrap brandbar-inner">
    <div class="brandmark"><span class="brandmark-f">F</span><span class="brandmark-word">Frankly Inspired <span class="brandmark-tail">and Associates</span></span></div>
    <div class="brandbar-actions"><div class="brandbar-tag">Client workspace</div></div>
  </div>
</div>
<main class="cw" id="app"><p class="muted">Loading your workspace…</p></main>
<script src="/client.js"></script>
</body>
</html>
