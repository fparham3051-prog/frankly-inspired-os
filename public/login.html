<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Frankly Inspired Operating System</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#172337">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-mark"><span class="login-f">F</span><span class="login-word" data-org="name">Frankly Inspired and Associates</span></div>
    <h1>Operations</h1>
    <p class="sub">Sign in with your email and password. Using the original practice password? Leave email blank.</p>
    <p class="login-error" id="login-error" role="alert"></p>
    <form id="login-form">
      <label class="sr-only" for="login-email">Email</label>
      <input type="email" id="login-email" placeholder="Email" autocomplete="username" autofocus>
      <label class="sr-only" for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <div id="code-row" hidden>
        <label class="sr-only" for="login-code">6-digit code</label>
        <input type="text" id="login-code" placeholder="6-digit code from your authenticator app" inputmode="numeric" autocomplete="one-time-code" maxlength="7">
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>
  <script src="/org.js" defer></script>
  <script src="/login.js"></script>
</body>
</html>
